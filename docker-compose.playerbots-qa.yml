name: warwid-playerbots-qa

services:
  qa-database:
    container_name: warwid-playerbots-qa-db
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${QA_DB_ROOT_PASSWORD:?QA_DB_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - qa-database:/var/lib/mysql
    networks: [qa-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 10s
      retries: 60

  qa-db-import:
    container_name: warwid-playerbots-qa-db-import
    image: warwid/playerbots-qa-db-import:local
    build:
      context: .
      dockerfile: apps/docker/Dockerfile
      target: db-import
    environment:
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_LOGIN_DATABASE_INFO: qa-database;3306;root;${QA_DB_ROOT_PASSWORD};acore_auth_pb
      AC_WORLD_DATABASE_INFO: qa-database;3306;root;${QA_DB_ROOT_PASSWORD};acore_world_pb
      AC_CHARACTER_DATABASE_INFO: qa-database;3306;root;${QA_DB_ROOT_PASSWORD};acore_characters_pb
      AC_UPDATES_AUTO_SETUP: "1"
      AC_UPDATES_ALLOWED_MODULES: all
    volumes:
      - qa-etc:/azerothcore/env/dist/etc
      - ./var/runtime/playerbots-proof/logs:/azerothcore/env/dist/logs
    networks: [qa-network]
    depends_on:
      qa-database:
        condition: service_healthy
    restart: "no"

  qa-client-data:
    container_name: warwid-playerbots-qa-client-data
    image: warwid/playerbots-qa-client-data:local
    build:
      context: .
      dockerfile: apps/docker/Dockerfile
      target: client-data
    volumes:
      - qa-client-data:/azerothcore/env/dist/data
    restart: "no"

  qa-authserver:
    container_name: warwid-playerbots-qa-authserver
    image: warwid/playerbots-qa-authserver:local
    build:
      context: .
      dockerfile: apps/docker/Dockerfile
      target: authserver
    environment:
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_TEMP_DIR: /azerothcore/env/dist/temp
      AC_BIND_IP: 0.0.0.0
      AC_LOGIN_DATABASE_INFO: qa-database;3306;root;${QA_DB_ROOT_PASSWORD};acore_auth_pb
    ports:
      - "127.0.0.1:13724:3724"
    volumes:
      - qa-etc:/azerothcore/env/dist/etc
      - ./var/runtime/playerbots-proof/logs:/azerothcore/env/dist/logs
    networks: [qa-network]
    depends_on:
      qa-database:
        condition: service_healthy
      qa-db-import:
        condition: service_completed_successfully
    restart: unless-stopped

  qa-worldserver:
    container_name: warwid-playerbots-qa-worldserver
    image: warwid/playerbots-qa-worldserver:local
    build:
      context: .
      dockerfile: apps/docker/Dockerfile
      target: worldserver
    command:
      - /bin/bash
      - -lc
      - >-
        rm -f /azerothcore/qa-run/worldserver.console &&
        mkfifo /azerothcore/qa-run/worldserver.console &&
        while true; do cat /azerothcore/qa-run/worldserver.console; done |
        /azerothcore/env/dist/bin/worldserver
    environment:
      AC_CONFIG_PROFILE: warwid-small-group
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_BIND_IP: 0.0.0.0
      AC_WORLD_SERVER_PORT: "8085"
      AC_LOGIN_DATABASE_INFO: qa-database;3306;root;${QA_DB_ROOT_PASSWORD};acore_auth_pb
      AC_WORLD_DATABASE_INFO: qa-database;3306;root;${QA_DB_ROOT_PASSWORD};acore_world_pb
      AC_CHARACTER_DATABASE_INFO: qa-database;3306;root;${QA_DB_ROOT_PASSWORD};acore_characters_pb
      AC_PLAYERBOTS_DATABASE_INFO: qa-database;3306;root;${QA_DB_ROOT_PASSWORD};acore_playerbots_pb
      AC_PLAYERBOTS_UPDATES_ENABLE_DATABASES: "1"
      AC_AI_PLAYERBOT_ENABLED: "1"
      AC_AI_PLAYERBOT_RANDOM_BOT_AUTOLOGIN: "1"
      AC_AI_PLAYERBOT_MIN_RANDOM_BOTS: "5"
      AC_AI_PLAYERBOT_MAX_RANDOM_BOTS: "10"
      AC_AI_PLAYERBOT_ADD_CLASS_ACCOUNT_POOL_SIZE: "2"
      AC_AI_PLAYERBOT_DISABLED_WITHOUT_REAL_PLAYER: "0"
      AC_AI_PLAYERBOT_ADD_CLASS_COMMAND: "1"
      AC_AI_PLAYERBOT_RANDOM_BOT_JOIN_LFG: "0"
      AC_AI_PLAYERBOT_RANDOM_BOT_JOIN_BG: "0"
      AC_AI_PLAYERBOT_RANDOM_BOT_AUTO_JOIN_BG: "0"
      AC_AI_PLAYERBOT_RANDOM_BOT_ACCOUNT_PREFIX: rndbot
      AC_AI_PLAYERBOT_COMMAND_SERVER_PORT: "0"
      AC_AI_PLAYERBOT_PROOF_DUNGEON_COMMAND: "1"
      AC_INDIVIDUAL_PROGRESSION_BOT_ACCOUNTS_REGEX: ^RNDBOT.*
      AC_AHBOT_ACCOUNT_ID: "0"
      AC_AHBOT_CHARACTER_GUID: "0"
    ports:
      - "127.0.0.1:18085:8085"
    volumes:
      - qa-etc:/azerothcore/env/dist/etc
      - qa-client-data:/azerothcore/env/dist/data:ro
      - ./var/runtime/playerbots-proof/logs:/azerothcore/env/dist/logs
      - ./var/runtime/playerbots-proof/run:/azerothcore/qa-run
    networks: [qa-network]
    depends_on:
      qa-database:
        condition: service_healthy
      qa-db-import:
        condition: service_completed_successfully
      qa-client-data:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  qa-database:
    name: warwid-playerbots-qa-database
  qa-etc:
    name: warwid-playerbots-qa-etc
  qa-client-data:
    name: warwid-playerbots-qa-client-data

networks:
  qa-network:
    name: warwid-playerbots-qa-network
